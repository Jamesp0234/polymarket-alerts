name: Polymarket Neobrother Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: last_seen.json
          key: neobrother-state-
          restore-keys: |
            neobrother-state-

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MY_BALANCE: ${{ secrets.MY_BALANCE }}
        run: python monitor.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: last_seen.json
          key: neobrother-state-${{ github.run_id }}
